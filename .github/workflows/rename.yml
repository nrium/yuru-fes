name: Rename file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "nrium"
          git config user.email "nrium@users.noreply.github.com"
          git mv yuruyurukiyarakutaji-homupezi.html index.html
          git commit -m "Rename yuruyurukiyarakutaji-homupezi.html to index.html"
          git push
